name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go vet ./...
      - run: go test ./...
      - name: CLI end-to-end gate
        run: go test -count=1 -v ./e2e
      - run: go test -race ./space ./cmd/...
      - run: python3 spec/checks/validate.py
      - name: Semantic conformance
        run: go run ./cmd/memory conformance
